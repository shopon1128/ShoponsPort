<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimalZoo — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="../works.css">
  <style>
    /* ---------- 動画カード ---------- */
    .video-card {
      border:        2.5px solid var(--border);
      padding:       28px;
      background:    var(--card-bg);
      display:       grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows:    auto 1fr;
      gap:           12px 24px;
      position:      relative;
      animation:     fadeUp 0.5s 0.05s ease both;
      margin-bottom: 0;
    }

    .video-card::before {
      content:  '';
      position: absolute;
      inset:    5px -5px -5px 5px;
      border:   2.5px solid var(--accent);
      z-index:  -1;
    }

    /* サムネイル列にビデオを収める */
    .video-thumb {
      grid-row:     1 / 3;
      border:       2px solid var(--border);
      overflow:     hidden;
      aspect-ratio: 4 / 3;
      background:   #000;
      display:      flex;
      align-items:  center;
      justify-content: center;
    }

    .video-thumb video {
      width:      100%;
      height:     100%;
      object-fit: contain;
      display:    block;
    }

    /* ---------- ダウンロード行 ---------- */
    .dl-row {
      display: flex;
      gap:     10px;
      flex-wrap: wrap;
    }

    .dl-btn {
      font-family:    'Syne', sans-serif;
      font-size:      0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background:     var(--accent);
      color:          #fff;
      padding:        5px 14px;
      text-decoration: none;
      border:         2px solid var(--border);
      transition:     transform 0.15s ease, box-shadow 0.15s ease;
      display:        inline-block;
    }

    .dl-btn:hover {
      transform:  translate(-2px, -2px);
      box-shadow: 3px 3px 0 var(--border);
    }

    /* ---------- レスポンシブ ---------- */
    @media (max-width: 620px) {
      .video-card {
        grid-template-columns: 1fr;
        grid-template-rows:    auto auto auto auto;
      }
      .video-thumb {
        grid-row:     auto;
        aspect-ratio: 16 / 9;
      }
    }
  </style>
</head>
<body>

  <header>
    <a class="back-link" href="../index.html">← ホームへ戻る</a>
    <h1>School Works</h1>
  </header>

  <main class="works-list">

    <article class="video-card">
      <!-- 左: 動画 -->
      <div class="video-thumb">
        <video controls preload="metadata">
          <source src="movie.mp4" type="video/mp4">
          お使いのブラウザは動画の再生に対応していません。
        </video>
      </div>

      <!-- 右上: タイトル -->
      <div class="work-title">
        <span style="font-family:'Syne',sans-serif;font-weight:700;font-size:1.1rem;border-bottom:2px solid var(--accent);padding-bottom:2px;">お口にポンっとアニマルZOO!</span>
      </div>

      <!-- 右下: 説明 -->
      <div class="work-desc">
        動物たちに餌をあげるゲーム。<br>
        Z/X/Cキーで動物を指定できます。動物たちの好みに合った餌をあげよう!<br>
        ゲームの全体的なロジック部分と、タイトルの演出を担当しました。<br>
        制作期間1ヶ月
      </div>

      <!-- タグ + ダウンロードボタン -->
      <div class="work-tags">
        <span class="tag">チーム制作</span>
        <span class="tag">Unity</span>
        <span class="tag">C#</span>
        <a class="dl-btn" href="WIN" download>⬇ Windows</a>
        <a class="dl-btn" href="MAC" download>⬇ macOS</a>
      </div>
    </article>

  </main>

  <footer><p>© 2026 Shopon</p></footer>

</body>
</html>
